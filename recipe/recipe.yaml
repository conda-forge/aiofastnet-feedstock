schema_version: 1

context:
  version: "1.2.0"

package:
  name: aiofastnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiofastnet/aiofastnet-${{ version }}.tar.gz
  sha256: d1fa2500e287b7e31a88754724ce7bfcf8b83884a15547be4b5f7753946128c3

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: match(python, "<3.11")

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - setuptools >=78.0
    - cython >=3.3
    - wheel
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - aiofastnet
      pip_check: true

about:
  summary: Fast transport/protocol networking for asyncio
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tarasko/aiofastnet
  repository: https://github.com/tarasko/aiofastnet

extra:
  recipe-maintainers:
    - thewchan
