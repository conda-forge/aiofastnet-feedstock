schema_version: 1

context:
  version: "1.0.4"

package:
  name: aiofastnet
  version: ${{ version }}

source:
  url: https://github.com/tarasko/aiofastnet/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 45c87c6eda20815553f58e56323d3f929641ceef9d5d65011e0e4283466d68bd

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: match(python, "<3.11")

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - setuptools >=78.0
    - cython >=3.2
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - aiofastnet
      pip_check: true

about:
  summary: Fast transport/protocol networking for asyncio
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tarasko/aiofastnet
  repository: https://github.com/tarasko/aiofastnet

extra:
  recipe-maintainers:
    - thewchan
