schema_version: 1

context:
  version: "1.2.0"

package:
  name: aiofastnet
  version: ${{ version }}

source:
  url: https://github.com/tarasko/aiofastnet/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7f4285ee53dc71690038825cf7a87ba19534223b5f0798b435edd699d6f22119

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: match(python, "<3.11")

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - setuptools >=78.0
    - cython >=3.3
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - aiofastnet
      pip_check: true

about:
  summary: Fast transport/protocol networking for asyncio
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tarasko/aiofastnet
  repository: https://github.com/tarasko/aiofastnet

extra:
  recipe-maintainers:
    - thewchan
